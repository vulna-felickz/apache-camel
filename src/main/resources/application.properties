server.port=8080

# H2 in-memory datasource (development only — use a real DB with credentials in production)
spring.datasource.url=jdbc:h2:mem:vulndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# H2 console enabled for demo purposes only — disable in production
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Camel servlet mapping
camel.component.servlet.mapping.context-path=/api/*

# Suppress Spring Boot autoconfigured camelContext banner noise
camel.springboot.main-run-controller=true
